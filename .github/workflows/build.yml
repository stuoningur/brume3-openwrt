name: Brume 3 OpenWrt bauen

on:
  push:
    branches: [main]
    paths: ['config/**', 'patches/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      source_ref:
        description: "OpenWrt-main-Commit (Standard: geprüfter Stand 46e6335; patches/ muss darauf passen)"
        default: 46e6335fbd3b825008a39758a45fa97a39814e3b
        required: true
      all_kmods:
        description: "Alle Kernelmodule mitbauen (dauert länger, erlaubt spätere Nachinstallation)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/openwrt/openwrt.git
  # Geprüfter Stand: OpenWrt main 46e6335 (03.11.2026, Linux 6.18.60);
  # darauf werden die Patches aus patches/ angewendet (PR #24237 + Review-Fixes)
  SOURCE_REF: ${{ inputs.source_ref || '46e6335fbd3b825008a39758a45fa97a39814e3b' }}
  ALL_KMODS: ${{ inputs.all_kmods && 'true' || (github.event_name == 'push' && 'true' || 'false') }}
  # Feeds auf den Stand des Basis-Commits festnageln (wie bei einem Release)
  FEED_PACKAGES: 1f7abcb5127707be54c8edac0201baa82ad641d7
  FEED_LUCI: ae19cdfda79ad0b6ade2747d2276b1c4171181fc
  FEED_ROUTING: ea8633da9c461a9bdc62a0323439d31180762e03
  OPENWRT_PATH: /mnt/openwrt
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Build-Repo auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / /mnt

      - name: Build-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev \
            file wget libelf-dev ccache zstd

      - name: Quellen klonen (festgenagelter Commit) und Patches anwenden
        run: |
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown "$USER:$USER" "$OPENWRT_PATH"
          git clone --filter=blob:none --no-checkout "$SOURCE_REPO" "$OPENWRT_PATH"
          cd "$OPENWRT_PATH"
          # Per SHA holen: funktioniert auch, wenn der Branch später umgeschrieben wird
          git fetch --filter=blob:none origin "$SOURCE_REF"
          git checkout -q --detach FETCH_HEAD
          if echo "$SOURCE_REF" | grep -qE '^[0-9a-f]{40}$'; then
            test "$(git rev-parse HEAD)" = "$SOURCE_REF" \
              || { echo "FEHLER: HEAD ist nicht $SOURCE_REF"; exit 1; }
          fi
          echo "SRC_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git -c user.name=build-bot -c user.email=build-bot@users.noreply.github.com \
            am "$GITHUB_WORKSPACE"/patches/*.patch
          grep -q 'define Device/glinet_gl-mt5000' target/linux/mediatek/image/filogic.mk \
            || { echo "FEHLER: Geräterezept glinet_gl-mt5000 fehlt"; exit 1; }
          git log --oneline -6

      - name: Cache laden (Downloads & ccache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: brume3-${{ env.SRC_REV }}-${{ hashFiles('config/brume3.config', 'patches/**') }}
          restore-keys: brume3-

      - name: Feeds aktualisieren
        run: |
          cd "$OPENWRT_PATH"
          # Telefonie- und Video-Feed weggelassen: liefern nichts fürs Image,
          # rtpengine-kmod baut z. B. nicht mit Kernel 6.18
          cat > feeds.conf <<EOF
          src-git packages https://git.openwrt.org/feed/packages.git^${FEED_PACKAGES}
          src-git luci https://git.openwrt.org/project/luci.git^${FEED_LUCI}
          src-git routing https://git.openwrt.org/feed/routing.git^${FEED_ROUTING}
          EOF
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Konfigurieren
        run: |
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/config/brume3.config" .config
          if [ "$ALL_KMODS" = "true" ]; then
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          echo "CONFIG_BUILD_LOG=y" >> .config
          make defconfig
          # Sicherstellen, dass nichts Wichtiges stillschweigend weggefallen ist
          for p in TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000 PACKAGE_luci; do
            grep -q "^CONFIG_${p}=y" .config || { echo "FEHLER: $p fehlt nach defconfig"; exit 1; }
          done
          echo "Konfiguration OK"

      - name: Quellen herunterladen
        run: |
          cd "$OPENWRT_PATH"
          make -j$(nproc) download || make -j1 V=s download

      - name: Kompilieren
        run: |
          cd "$OPENWRT_PATH"
          # IGNORE_ERRORS="n m": ein kaputtes optionales Modul (m) bricht den Build
          # nicht ab; fest eingebaute Pakete (y) müssen weiterhin bauen.
          make -j$(nproc) IGNORE_ERRORS="n m" || make -j1 V=s IGNORE_ERRORS="n m"

      - name: Cache speichern (auch bei Fehler)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/openwrt/dl
            /mnt/openwrt/.ccache
          key: brume3-${{ env.SRC_REV }}-${{ hashFiles('config/brume3.config', 'patches/**') }}-${{ github.run_id }}

      - name: Fehlerprotokolle in Branch build-logs sichern
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          R="$RUNNER_TEMP/report"; mkdir -p "$R"
          {
            echo "Run ${{ github.run_id }} – Quelle ${SRC_REV:-?} – $(date -u)"
            echo
            echo "== Pakete mit Build-Fehlern =="
            grep -rlE 'make\[[0-9]+\]: \*\*\*' logs/package logs/target 2>/dev/null | sort || true
          } > "$R/zusammenfassung.txt"
          for f in $(grep -rlE 'make\[[0-9]+\]: \*\*\*' logs/package logs/target 2>/dev/null | head -40); do
            out="$R/$(echo "$f" | tr '/' '_')"
            tail -n 120 "$f" > "$out"
          done
          cd "$RUNNER_TEMP"
          rm -rf logrepo && git clone -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logrepo
          cd logrepo
          git checkout -q --orphan build-logs && git rm -rqf . || true
          cp "$R"/* .
          git add -A
          git -c user.name=build-bot -c user.email=build-bot@users.noreply.github.com \
            commit -qm "Build-Logs Run ${{ github.run_id }}" && git push -qf origin build-logs || true

      - name: Ergebnisse einsammeln
        if: always()
        run: |
          cd "$OPENWRT_PATH"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          T=bin/targets/mediatek/filogic
          cp $T/*gl-mt5000*sysupgrade.bin $T/*gl-mt5000*factory.bin "$OUT/" 2>/dev/null || true
          cp $T/*.manifest $T/config.buildinfo $T/feeds.buildinfo $T/version.buildinfo "$OUT/" 2>/dev/null || true
          if [ -d "$T/packages" ]; then
            tar -C "$T" -czf "$OUT/kmods-und-target-pakete.tar.gz" packages
          fi
          (cd "$OUT" && sha256sum * > sha256sums.txt) || true
          ls -la "$OUT"
          echo "TAG=brume3-$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brume3-firmware
          path: out/
          retention-days: 30

      - name: Release anlegen
        if: success()
        # softprops/action-gh-release v2, auf Commit festgenagelt
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }} (Quelle ${{ env.SRC_REV }})
          prerelease: true
          body: |
            OpenWrt für GL.iNet GL-MT5000 (Brume 3), Standard-Paketauswahl (nur LuCI zusätzlich)
            Quelle: openwrt/openwrt main @ ${{ env.SRC_REV }} + patches/ (PR #24237 neu aufgesetzt, plus Review-Fixes: Tagger-MAC-Header, Special-Tag-Gating, Factory-Zellen)
            Feeds: packages ${{ env.FEED_PACKAGES }}, luci ${{ env.FEED_LUCI }}, routing ${{ env.FEED_ROUTING }}
            Alle kmods: ${{ env.ALL_KMODS }}
          files: out/*
